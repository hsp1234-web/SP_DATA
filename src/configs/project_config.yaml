# 專案唯一的設定中心

# 1. 資料庫設定
database:
  db_directory: "data"
  financial_data_db_name: "financial_data.duckdb"

# 2. 數據獲取時間範圍
data_fetch_range:
  start_date: "2022-01-01" # 建議從較近的日期開始，以加速首次運行
  end_date: "" # 留空表示到今天

# 3. API 端點與設定
api_endpoints:
  fred:
    api_key_env: "FRED_API_KEY" # 必須設定的環境變數
    base_url: "https://api.stlouisfed.org/fred/series/observations"

# 4. 核心指標代碼
target_metrics:
  fred_series_ids:
    - "DGS10"
    - "DGS2"
    - "SOFR"
    - "VIXCLS"
    - "WRESBAL"
  yfinance_tickers:
    - "^MOVE"

# 5. NYFed 一級交易商數據設定
nyfed_primary_dealer_urls:
  - url: "https://www.newyorkfed.org/medialibrary/media/markets/prideal/prideal2024.xlsx"
    format_type: "SBP2013"
  - url: "https://www.newyorkfed.org/medialibrary/media/markets/prideal/prideal2023.xlsx"
    format_type: "SBP2013"
  - url: "https://www.newyorkfed.org/medialibrary/media/markets/prideal/prideal2022.xlsx"
    format_type: "SBP2013"

# 6. NYFed 不同格式的處理配方
nyfed_format_recipes:
  SBP2013:
    header_row: 2
    date_column: "As of Date"
    columns_to_sum:
      - "U.S. Treasury coupons"
      - "U.S. Treasury bills"
      - "U.S. Treasury floating rate notes (FRNs)"
      - "Federal agency and GSE debt securities"
      - "Federal agency and GSE mortgage-backed securities (MBS)"
      - "Corporate bonds, notes, and other"
      - "Municipal securities"
      - "Equities and other"

# 7. 指標計算引擎的參數
indicator_engine_params:
  rolling_window_days: 252
  stress_index_weights:
    sofr_deviation: 0.20
    spread_10y2y: 0.20
    primary_dealer_position: 0.15
    move_index: 0.25
    vix_index: 0.15
    pos_res_ratio: 0.05
